[package]
name = "armature-cron"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Scheduled task execution for Armature applications"
keywords = ["cron", "scheduler", "tasks", "background"]
categories = ["web-programming", "asynchronous"]

[dependencies]
# Logging
armature-log = { path = "../armature-log", version = "0" }

# Core dependencies
async-trait = "0.1"
thiserror = "2.0"
tokio = { version = "1.52", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
chrono = "0.4"
cron = "0.17"

# DI integration
armature-core = { path = "../armature-core", version = "0" }

[dev-dependencies]
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "test-util"] }

