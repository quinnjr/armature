[package]
name = "armature-webhooks"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Webhook sending and receiving for Armature"
keywords = ["webhooks", "events", "http", "notifications"]
categories = ["web-programming", "asynchronous"]

[dependencies]
# Core dependencies
armature-core = { path = "../armature-core", version = "0" }
async-trait = "0.1"
thiserror = "2.0"
tracing = "0.1"

# Async runtime
tokio = { version = "1.52", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3"

# HTTP client for outgoing webhooks
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cryptographic signatures
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Unique identifiers
uuid = { version = "1.23", features = ["v4", "serde"] }

# URL parsing
url = "2.5"

[dev-dependencies]
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "test-util"] }
wiremock = "0.6"

