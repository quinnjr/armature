# gitleaks configuration (https://github.com/gitleaks/gitleaks)
#
# Extends gitleaks' built-in rule set and allowlists only values that are
# PUBLIC, documented placeholders or deliberately fake test fixtures. Every
# entry below is a known non-secret; anything else that matches a rule is a
# finding. Keep entries as narrow as possible (exact value or exact path),
# and add a comment saying why each one is safe.
#
# Usage:
#   gitleaks git --config .gitleaks.toml          # history of this repo
#   gitleaks dir --config .gitleaks.toml .        # working tree (incl. submodules)
#
# Requires gitleaks >= 8.25 for the [[allowlists]] array syntax.

title = "armature gitleaks config"

[extend]
useDefault = true

# -----------------------------------------------------------------------------
# Documented emulator / example credentials (public by design)
# -----------------------------------------------------------------------------
[[allowlists]]
description = "Public emulator and documentation example credentials"
regexTarget = "match"
regexes = [
  # Azurite (Azure Storage emulator) well-known account key for
  # devstoreaccount1, published in Microsoft's docs.
  '''Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==''',
  # AWS documentation example access key pair.
  '''AKIAIOSFODNN7EXAMPLE''',
  '''wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY''',
]
stopwords = [
  # LocalStack's documented dummy credentials (AWS_ACCESS_KEY_ID=test /
  # AWS_SECRET_ACCESS_KEY=test) and the Azurite account name.
  "devstoreaccount1",
]

# -----------------------------------------------------------------------------
# Deliberately fake provider keys used by redaction / sanitizer tests
# (armature-payments, armature-audit, armature-app, armature-webhooks). They
# exist to prove that real-looking keys are masked in logs and error bodies.
# -----------------------------------------------------------------------------
[[allowlists]]
description = "Fake Stripe-style keys in sanitizer and webhook tests"
regexTarget = "match"
regexes = [
  '''\b(sk|rk|pk)_(live|test)_(abcdef[a-z]*|secret|1|123|x+|fake[A-Za-z0-9_]*|test[A-Za-z0-9_]*)\b''',
  '''\bwhsec_(abcdefghij|attacker_guess|my_super_secret_key|test[A-Za-z0-9_]*|fake[A-Za-z0-9_]*)\b''',
]

# -----------------------------------------------------------------------------
# Fixed fake values in unit tests, doc examples and docs (each checked by hand)
# -----------------------------------------------------------------------------
[[allowlists]]
description = "Fake values in tests, doc examples and documentation"
regexTarget = "secret"
regexes = [
  # armature-azure servicebus.rs connection-string parser test / LockToken UUID
  '''^abc123def456==$''',
  '''^7da9cfd5-40d5-4bb1-8d64-ec5a52e1c547$''',
  # armature-security request_signing.rs doc example (a visibly fake 32-byte key)
  '''^0123456789abcdef0123456789abcdef$''',
  # armature-payments provider.rs sanitizer test: base64("public_key:private_key_very_secret")
  '''^cHVibGljX2tleTpwcml2YXRlX2tleV92ZXJ5X3NlY3JldA$''',
  # armature-siem client.rs: expected HMAC for a fixed test key/workspace
  '''^xJZwrcXTwTLznci6k1CzpQVgM4PIvPImd8Xlj6QEO1g=$''',
  # Truncated JWT header shown in examples/audit_example.rs
  '''^eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.\.\.$''',
  # Redaction example in docs/error-transformation-guide.md
  '''^api_key=abc123$''',
  # Placeholder bearer tokens in curl examples (docs/, examples/)
  '''^(your-token-here|my-token|user-token|admin-token|YOUR_TOKEN|token123)$''',
]

[[allowlists]]
description = "Unsigned alg:none JWTs used to test that unverified tokens are rejected"
regexTarget = "match"
regexes = [
  # header {"alg":"none"}; carries no signature, so it is not a credential
  '''eyJhbGciOiJub25lIn0\.[A-Za-z0-9_-]+\.''',
]

# -----------------------------------------------------------------------------
# Test-only key material, by exact location, in this repository's history
#
# These paths carry the crate directory because they match commits from before
# the crates moved into their own repositories, when the files lived here.
# The per-crate scans are covered by the commit-pinned entries below.
# -----------------------------------------------------------------------------
[[allowlists]]
description = "Throwaway private keys used only by test suites"
paths = [
  # armature-jwt RS/EC/Ed25519 signing tests
  '''(^|/)armature-jwt/tests/fixtures/test_(rsa|ec|ed25519)_priv\.pem$''',
  # armature-auth OIDC id_token verification tests
  '''(^|/)armature-auth/tests/fixtures/oidc_test_ec_priv\.pem$''',
]

[[allowlists]]
description = "PEM header literals in key-encoding code, and test-only keys in tests"
targetRules = ["private-key"]
paths = [
  # Code that *writes* a PEM header around freshly generated/encoded DER
  '''(^|/)armature-acme/src/(jws|client)\.rs$''',
  '''(^|/)armature-storage/src/gcs\.rs$''',
  # Throwaway keys that sign only against stub servers in tests
  '''(^|/)armature-push/tests/(apns|fcm)\.rs$''',
]

# -----------------------------------------------------------------------------
# Test-only key material and PEM header literals, by exact commit AND path
#
# The CI loop scans each crate's own history (`gitleaks git armature-x/`), so
# paths here are relative to that crate's repository, not to this one. A path
# alone would then allow the same file name in every crate; pairing it with
# the commit that introduced the match pins each entry to one file in one
# repository, and a key added anywhere else — or later — is still a finding.
# -----------------------------------------------------------------------------
[[allowlists]]
description = "armature-jwt: RS256 signing-test key"
condition = "AND"
targetRules = ["private-key"]
commits = ["1390325d9f430160fdb71d9004e1332e1724b42b"]
paths = ['''^tests/fixtures/test_rsa_priv\.pem$''']

[[allowlists]]
description = "armature-jwt: EC signing-test key"
condition = "AND"
targetRules = ["private-key"]
commits = ["04169e270678676b1d8018bb35f862e4c621f1e1"]
paths = ['''^tests/fixtures/test_ec_priv\.pem$''']

[[allowlists]]
description = "armature-jwt: Ed25519 signing-test key"
condition = "AND"
targetRules = ["private-key"]
commits = ["04169e270678676b1d8018bb35f862e4c621f1e1"]
paths = ['''^tests/fixtures/test_ed25519_priv\.pem$''']

[[allowlists]]
description = "armature-auth: OIDC id_token verification-test key"
condition = "AND"
targetRules = ["private-key"]
commits = ["d003d10c02e11edfe21a553177cd1b3a59cec045"]
paths = ['''^tests/fixtures/oidc_test_ec_priv\.pem$''']

[[allowlists]]
description = "armature-acme: PEM header literal in pkcs8_to_pem"
condition = "AND"
targetRules = ["private-key"]
commits = ["05c2b05cc841b11ecc41f1471efbdf3754b2e896"]
paths = ['''^src/jws\.rs$''']

[[allowlists]]
description = "armature-acme: PEM header literal in a save_certificate rejection test"
condition = "AND"
targetRules = ["private-key"]
commits = ["05c2b05cc841b11ecc41f1471efbdf3754b2e896"]
paths = ['''^src/client\.rs$''']

[[allowlists]]
description = "armature-push: throwaway keys signing only against stub servers"
condition = "AND"
targetRules = ["private-key"]
commits = ["3e81a1ff59b0ae5d645d2ac18a1ef6c69dcb610a"]
paths = ['''^tests/(apns|fcm)\.rs$''']

[[allowlists]]
description = "armature-storage: unit-test service-account key (signs nothing real)"
condition = "AND"
targetRules = ["private-key"]
commits = ["8f45fa8a397cdd917c32d0f4de1b2b0691ad7149"]
paths = ['''^src/gcs\.rs$''']

[[allowlists]]
description = "armature-storage: PEM header literal in a unit-test helper"
condition = "AND"
targetRules = ["private-key"]
commits = ["81553fa5d4a329d7d777251654bf6282f79b4f3b"]
paths = ['''^src/gcs\.rs$''']

[[allowlists]]
description = "Generated build output of the docs site (rendered copies of docs/)"
paths = [
  '''(^|/)web/dist/''',
]
