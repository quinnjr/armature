[package]
name = "armature-grpc"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "gRPC server and client support for Armature"
keywords = ["grpc", "protobuf", "rpc", "server", "client"]
categories = ["network-programming", "asynchronous"]

[dependencies]
# Logging
armature-log = { path = "../armature-log", version = "0.1.0" }

# gRPC
tonic = { version = "0.14", features = ["gzip", "zstd", "tls-ring"] }
prost = "0.14"
prost-types = "0.14"

# rustls: explicit direct dependency so this crate can install the `ring`
# CryptoProvider itself at TLS-setup time (see `crypto_provider::ensure_installed`).
# Without this, rustls's automatic provider detection panics whenever this
# crate is built alongside anything else that also compiles in the
# `aws-lc-rs` provider (e.g. most AWS SDK crates) — Cargo unifies both
# providers into one binary and rustls refuses to guess between them.
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# Async runtime
tokio = { version = "1.52", features = ["rt-multi-thread", "net", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }

# Tower (middleware)
tower = { version = "0.5", features = ["timeout", "limit", "load-shed", "retry", "util"] }
tower-service = "0.3"

# HTTP
http = "1.4"
http-body = "1.0"
http-body-util = "0.1"
bytes = "1.12"
hyper = { version = "1.10", features = ["server", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"

# Tracing
tracing = "0.1"

# Utilities
async-trait = "0.1"
futures = "0.3"
parking_lot = "0.12"

# Optional: Reflection
tonic-reflection = { version = "0.14", optional = true }

# Optional: Health checking
tonic-health = { version = "0.14", optional = true }

[build-dependencies]
tonic-build = "0.14"

[features]
default = ["health", "reflection"]
health = ["tonic-health"]
reflection = ["tonic-reflection"]

[dev-dependencies]
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "test-util"] }
tokio-test = "0.4"
tonic-health = { version = "0.14" }
tonic-reflection = { version = "0.14" }
rcgen = { version = "0.14", features = ["pem"] }

