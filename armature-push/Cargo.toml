[package]
name = "armature-push"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Push notifications for Armature - Web Push, FCM, and APNS"
keywords = ["push", "notifications", "fcm", "apns", "web-push"]
categories = ["web-programming", "asynchronous"]

[dependencies]
# Async runtime
tokio = { version = "1.52", features = ["sync", "time"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "form"] }

# Error handling
thiserror = "2.0"

# Utilities
tracing = "0.1"
uuid = { version = "1.23", features = ["v4"] }
base64 = "0.22"
url = "2.5"
futures = "0.3"

# Web Push (VAPID). We use web-push only to build the VAPID signature and
# the encrypted ECE payload; the notification is sent over our own reqwest
# (rustls) client. `default-features = false` drops web-push's default
# `isahc-client`, which pulled `isahc` → `curl-sys` → a vendored libcurl C
# build — so `features = ["web-push"]` no longer needs libcurl/libssl on the
# build host and stays pure-Rust/rustls like the rest of the workspace.
web-push = { version = "0.11", default-features = false, optional = true }

# JWT for FCM/APNS. `rust_crypto` is required: without it (or `aws_lc_rs`)
# jsonwebtoken 10's `encode`/`decode` panic at runtime because no process-level
# `CryptoProvider` can be auto-selected. `rust_crypto` keeps the pure-Rust
# story consistent with the rest of this crate (rustls elsewhere, no libcurl).
jsonwebtoken = { version = "10.4", optional = true, default-features = false, features = ["use_pem", "rust_crypto"] }

# Cryptography for APNS
p256 = { version = "0.13", features = ["ecdsa", "pem"], optional = true }

[dev-dependencies]
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "test-util"] }
tokio-test = "0.4"
armature-testkit = { path = "../armature-testkit" }

[features]
default = ["fcm"]
web-push = ["dep:web-push"]
fcm = ["jsonwebtoken"]
apns = ["jsonwebtoken", "p256", "reqwest/http2"]
all = ["web-push", "fcm", "apns"]

