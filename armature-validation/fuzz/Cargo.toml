[package]
name = "armature-validation-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# Its own workspace root: `libfuzzer-sys` links a sanitizer runtime and builds
# only on nightly, so a plain `cargo build` at the repo root must not reach it.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
armature-validation = { path = ".." }
uuid = "1"
url = "2"

[[bin]]
name = "validators"
path = "fuzz_targets/validators.rs"
test = false
doc = false
bench = false
