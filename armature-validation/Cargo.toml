[package]
name = "armature-validation"
version = "0.1.3"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Request validation for Armature handlers"
keywords = ["validation", "validator", "input", "sanitize"]
categories = ["web-programming"]

[dependencies]
armature-core = { path = "../armature-core", version = "0.2.1" }
armature-proc-macro = { path = "../armature-proc-macro", version = "0.1.4" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.12"
once_cell = "1.21"
async-trait = "0.1"
tokio = { version = "1.52", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
trybuild = "1.0"

