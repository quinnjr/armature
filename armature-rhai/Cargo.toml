[package]
name = "armature-rhai"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Rhai scripting language integration for Armature - write handlers in Rhai"
keywords = ["rhai", "scripting", "web", "embedded", "dsl"]
categories = ["web-programming", "development-tools"]

[dependencies]
# Core Armature
armature-core = { path = "../armature-core", version = "0.5.0" }
bytes = "1.12"

# Rhai scripting engine
rhai = { version = "1.25", features = ["sync", "serde", "metadata"] }

# Async runtime
# `rt`/`rt-multi-thread` are required so `script_handler` can detect and
# safely block on the caller's runtime flavor (see src/handler.rs).
tokio = { version = "1.52", features = ["sync", "fs", "time", "rt", "rt-multi-thread"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"

# Utilities
tracing = "0.1"
parking_lot = "0.12"
notify = { version = "8.2", optional = true }
dashmap = "6.2"

[dev-dependencies]
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "test-util"] }
tempfile = "3.27"

[features]
default = []
# Hot-reload scripts during development
hot-reload = ["notify"]
# Include standard library extensions
stdlib = []
# Include HTTP client bindings
http-client = []
# Include JSON schema validation
validation = []

