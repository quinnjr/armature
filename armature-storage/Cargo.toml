[package]
name = "armature-storage"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Multipart file upload and storage handling for Armature"
keywords = ["multipart", "upload", "storage", "s3", "file"]
categories = ["web-programming", "asynchronous"]

[dependencies]
# Async runtime
tokio = { version = "1.52", features = ["fs", "io-util", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
async-trait = "0.1"

# Multipart parsing
multer = "3.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP types
bytes = "1.12"
http = "1.4"
mime = "0.3"
mime_guess = "2.0"
# Magic-byte content sniffing, so type allowlists check the payload and not
# just the client-declared Content-Type.
infer = "0.22"

# Error handling
thiserror = "2.0"

# Utilities
tracing = "0.1"
uuid = { version = "1.23", features = ["v4"] }
sha2 = "0.11"
hex = "0.4"
pin-project-lite = "0.2"
tempfile = "3.27"

# Cloud storage clients (optional features)
# AWS S3
aws-sdk-s3 = { version = "1.122", optional = true }
aws-config = { version = "1.8", optional = true }

# Google Cloud Storage
armature-gcp = { path = "../armature-gcp", version = "0.1.0", optional = true, features = ["storage"] }
google-cloud-storage = { version = "1.15", optional = true }
google-cloud-gax = { version = "1.11", optional = true }
google-cloud-auth = { version = "1.13", optional = true }

# Azure Blob Storage (new Azure SDK: azure_storage_blob 1.0 on azure_core 1.0 + azure_identity 1.0)
armature-azure = { path = "../armature-azure", version = "0.1.0", optional = true, features = ["blob"] }
azure_storage_blob = { version = "1.0", optional = true }
azure_core = { version = "1.0", optional = true }
azure_identity = { version = "1.0", optional = true }
base64 = { version = "0.22", optional = true }

[dev-dependencies]
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "test-util"] }
tokio-test = "0.4"
armature-testkit = { path = "../armature-testkit" }

[features]
default = []
s3 = ["aws-sdk-s3", "aws-config"]
gcs = ["armature-gcp", "google-cloud-storage", "google-cloud-gax", "google-cloud-auth"]
azure = ["armature-azure", "azure_storage_blob", "azure_core", "azure_identity", "base64"]
all-clouds = ["s3", "gcs", "azure"]

