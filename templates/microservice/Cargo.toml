[package]
name = "microservice"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"

# Mark this as a standalone project (not part of workspace)
[workspace]

[dependencies]
# Armature with queue feature.
#
# NOTE: the crates.io name "armature" is squatted by an unrelated, unmaintained
# package, so the real crate -- published as "armature-framework" but exposing
# its library as `armature` (see this repo's root `[lib] name = "armature"`)
# -- must be pulled in under an explicit `package` rename.
armature = { package = "armature-framework", version = "0.5", features = ["queue"] }
# Both requirements pin the exact minor. 0.x minors are breaking under
# Cargo's caret rules and this project treats them that way, so a bare "0"
# would let a user resolve armature-core 0.9 against armature-framework 0.4
# and get a template that does not compile.
# armature-core is required directly because armature's macro-expanded code references armature_core:: paths that aren't currently re-exported through the armature facade crate.
armature-core = "0.8"
async-trait = "0.1"

# Runtime
tokio = { version = "1.35", features = ["full", "signal"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Configuration
dotenvy = "0.15"

# Time
chrono = { version = "0.5", features = ["serde"] }

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }

