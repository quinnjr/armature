# =============================================================================
# Armature - Kubernetes Service Template
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: armature-api
  namespace: armature
  labels:
    app.kubernetes.io/name: armature-api
    app.kubernetes.io/managed-by: armature-cli
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: armature-api

