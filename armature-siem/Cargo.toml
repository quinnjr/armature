[package]
name = "armature-siem"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Enterprise SIEM integration for Armature - Splunk, Elastic, QRadar, Sentinel, and more"
keywords = ["siem", "security", "logging", "splunk", "elastic"]
categories = ["web-programming", "development-tools::debugging"]

[dependencies]
armature-core = { path = "../armature-core", version = "0.2.1", optional = true }
armature-audit = { path = "../armature-audit", version = "0.1.1", optional = true }
tokio = { version = "1.52", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.23", features = ["v4", "serde"] }
tracing = "0.1"
thiserror = "2.0"
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false, optional = true }
url = "2.5"
base64 = "0.22"
hostname = "0.4"
# NOTE: hmac 0.13 / sha2 0.11 are the current RustCrypto 0.13/0.11 line, and
# tokio-rustls 0.26 pulls in rustls 0.23 (ring-backed). These are
# intentionally newer than versions some transitive deps still resolve to
# (e.g. 0.12/0.10/0.24), which can cause duplicate builds of the same crate
# family in `cargo tree`. Unifying isn't practical since the older pins are
# held by transitive dependencies we don't control; this is documented,
# accepted debt rather than an oversight.
hmac = "0.13.0"
sha2 = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pemfile = "2.2"
webpki-roots = "1.0"
flate2 = "1.1.9"

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
rcgen = { version = "0.14", features = ["pem"] }
armature-testkit = { path = "../armature-testkit" }

[features]
default = []
di = ["armature-core"]
audit = ["armature-audit"]
http = ["reqwest"]
full = ["di", "audit", "http"]
