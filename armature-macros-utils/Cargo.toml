[package]
name = "armature-macros-utils"
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Utility functions for Armature macros"
keywords = ["macros", "utilities", "framework"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits"] }

[dev-dependencies]
# The generated macro code targets these crates; tests exercise the real
# expansions, so they are pulled in as dev-dependencies only. Callers of the
# macros must depend on the same crates themselves (see the crate docs — in
# particular `validate_email!` requires the caller to depend on `regex`).
armature-core = { path = "../armature-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1"
trybuild = "1"

