[package]
name = "armature-payments"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Payment processing with Stripe, PayPal, and Braintree for Armature framework"
keywords = ["payments", "stripe", "paypal", "braintree", "ecommerce"]
categories = ["web-programming", "api-bindings"]

[dependencies]
# NOTE: `armature-core` was declared here but referenced nowhere in `src/` or
# `tests/`; it has been removed rather than left to pull ~140 transitive crates
# into every build of this crate.
armature-log = { path = "../armature-log", version = "0.2.0" }
tokio = { version = "1.52", features = ["rt-multi-thread", "sync", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
async-trait = "0.1"
thiserror = "2.0"
uuid = { version = "1.23", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "form"] }
url = "2.5"
# Crypto/encoding deps are provider-specific: Stripe and Braintree sign webhooks
# (hmac + sha2 + hex), PayPal and Braintree base64-encode credentials/payloads.
# They are optional and feature-gated so `--no-default-features --features
# paypal` does not build an HMAC stack it never calls.
hmac = { version = "0.13", optional = true }
sha2 = { version = "0.11", optional = true }
sha1 = { version = "0.11", optional = true }
hex = { version = "0.4", optional = true }
base64 = { version = "0.22", optional = true }
rust_decimal = { version = "1.42", features = ["serde"] }
secrecy = { version = "0.10", features = ["serde"] }
quick-xml = { version = "0.37", features = ["serialize"], optional = true }

[features]
# All three providers are on by default because with `default = ["stripe"]` the
# PayPal and Braintree webhook-verification regression tests were silently
# skipped by a plain `cargo test` — a signature-verification bug in either
# provider would have shipped unnoticed. The providers are not dependency-free:
# Braintree pulls in `sha1` and `quick-xml`, and PayPal relies on serde_json's
# `raw_value`. Turning them off trades those dependencies for untested
# verification paths, so leave them on unless you run the full matrix.
default = ["stripe", "paypal", "braintree"]
# Stripe verifies webhooks with HMAC-SHA256 over a hex-encoded signature.
stripe = ["dep:hmac", "dep:sha2", "dep:hex"]
# PayPal base64-encodes the OAuth client credentials.
paypal = ["dep:base64"]
# Braintree HMAC-SHA1s a base64 payload, hashes it for a stable event id, and
# parses the XML notification inside it.
braintree = [
    "dep:quick-xml",
    "dep:sha1",
    "dep:hmac",
    "dep:sha2",
    "dep:hex",
    "dep:base64",
]
full = ["stripe", "paypal", "braintree"]

[dev-dependencies]
armature-testkit = { path = "../armature-testkit" }
# Used to build a `reqwest::Response` in-process so the status-carrying transport
# error arm in `From<reqwest::Error>` is reachable from a test.
http = "1"
# `test-util` provides the paused-clock runtime (`#[tokio::test(start_paused)]`)
# the retry/backoff tests use to assert on delays without actually sleeping.
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
