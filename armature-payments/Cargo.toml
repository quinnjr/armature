[package]
name = "armature-payments"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Payment processing with Stripe, PayPal, and Braintree for Armature framework"
keywords = ["payments", "stripe", "paypal", "braintree", "ecommerce"]
categories = ["web-programming", "api-bindings"]

[dependencies]
armature-core = { path = "../armature-core", version = "0.2.1" }
armature-log = { path = "../armature-log", version = "0.1.0" }
tokio = { version = "1.52", features = ["rt-multi-thread", "sync", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
async-trait = "0.1"
thiserror = "2.0"
uuid = { version = "1.23", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "form"] }
url = "2.5"
hmac = "0.13"
sha2 = "0.11"
sha1 = "0.11"
hex = "0.4"
base64 = "0.22"
rust_decimal = { version = "1.42", features = ["serde"] }
secrecy = { version = "0.10", features = ["serde"] }

[features]
# All three providers are on by default: they add no dependencies (the feature
# gates only select modules), and with `default = ["stripe"]` the PayPal and
# Braintree webhook-verification regression tests were silently skipped by a
# plain `cargo test`.
default = ["stripe", "paypal", "braintree"]
stripe = []
paypal = []
braintree = []
full = ["stripe", "paypal", "braintree"]

[dev-dependencies]
armature-testkit = { path = "../armature-testkit" }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-test = "0.4"
wiremock = "0.6"

