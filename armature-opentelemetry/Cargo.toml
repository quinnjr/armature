[package]
name = "armature-opentelemetry"
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "OpenTelemetry integration for Armature observability"
keywords = ["opentelemetry", "tracing", "metrics", "observability"]
categories = ["development-tools::profiling", "web-programming"]

[dependencies]
armature-core = { path = "../armature-core", version = "0" }

# OpenTelemetry core (all versions must match)
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-semantic-conventions = "0.32"

# Tracing - OTLP is the primary and recommended exporter
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "trace", "metrics"], optional = true }

# Note: opentelemetry-jaeger and opentelemetry-prometheus are discontinued
# and not compatible with opentelemetry 0.31. Use OTLP instead.
# See: https://github.com/open-telemetry/opentelemetry-rust/tree/main/opentelemetry-otlp

# Zipkin exporter
opentelemetry-zipkin = { version = "0.32", features = ["reqwest-client"], optional = true }

# Async runtime
tokio = { version = "1.52", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }

# HTTP client
reqwest = { version = "0.13", default-features = false, features = ["rustls"], optional = true }
tonic = { version = "0.14", optional = true }

# Utilities
once_cell = "1.21"
thiserror = "2.0"

[dev-dependencies]
# `testing` unlocks the in-memory metric/span exporters used by the
# middleware's end-to-end recording tests (feature-unified with the runtime
# deps).
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "testing"] }
# Tests that mutate the process-global OpenTelemetry tracer provider
# (`opentelemetry::global::set_tracer_provider`) must not run concurrently
# with each other, or one test's provider swap can leak into another's
# assertions. `#[serial]` serializes just those tests within this crate.
serial_test = "3"

[features]
default = ["otlp"]
otlp = ["opentelemetry-otlp", "tonic"]
# jaeger and prometheus are discontinued and not compatible with opentelemetry 0.31
# Use OTLP with a collector that can export to Jaeger/Prometheus instead
zipkin = ["opentelemetry-zipkin", "reqwest"]
full = ["otlp", "zipkin"]
