[package]
name = "armature-ferron"
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Ferron reverse proxy integration for Armature"
keywords = ["ferron", "proxy", "reverse-proxy", "load-balancer"]
categories = ["web-programming", "network-programming"]

[dependencies]
# Core dependencies
tokio = { version = "1.52", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
async-trait = "0.1"

# Process management
nix = { version = "0.31", features = ["signal", "process"] }

# Health checking
reqwest = { version = "0.13", features = ["json"], default-features = false }

# File watching for config reload
notify = "8.2"

# URL parsing
url = "2.5"

# UUID for unique identifiers
uuid = { version = "1.23", features = ["v4"] }

# Time utilities
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.27"

[features]
default = []
# Enable native TLS for health checks
native-tls = ["reqwest/native-tls"]
# Enable rustls for health checks
rustls = ["reqwest/rustls"]

