[package]
name = "armature-mail"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Email sending with SMTP, templates, and provider integrations for Armature"
keywords = ["email", "smtp", "mail", "sendgrid", "ses"]
categories = ["email", "web-programming"]

[dependencies]
# Async runtime
tokio = { version = "1.52", features = ["sync", "time", "fs"] }
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# Email
# `pool` is required for `SmtpConfig::pool_size`, which is wired through
# lettre's `PoolConfig`.
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "pool", "builder", "hostname"] }

# Templates
handlebars = { version = "6.4", optional = true }
tera = { version = "2.0", optional = true }
minijinja = { version = "2.21", optional = true }

# Serialization
# `rc` is required for `EmailJob::email: Arc<Email>`, which keeps queue retries
# from deep-copying every attachment.
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"

# Utilities
tracing = "0.1"
# Used by `crate::http::validate_endpoint` to reject a plaintext provider
# endpoint before an API key is written to it in the clear.
url = "2.5"
mime_guess = "2.0"
uuid = { version = "1.23", features = ["v4"] }
# `Attachment::data`: cloning an attachment (per queue retry, per send attempt)
# is a refcount bump rather than a copy of the payload.
bytes = "1.12"

# HTTP client for API providers
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "multipart"], optional = true }

# Base64: provider attachment payloads *and* the queue's job serialization —
# a `Vec<u8>` serialized as a JSON number array costs ~4 bytes per source byte.
base64 = "0.22"

# AWS SES
aws-sdk-sesv2 = { version = "1.112", optional = true }
aws-config = { version = "1.8", optional = true }

# Redis for email queue
armature-redis = { path = "../armature-redis", version = "0", optional = true }
redis = { version = "1.3", features = ["tokio-comp"], optional = true }

# Async channels
chrono = { version = "0.4", optional = true }

[dev-dependencies]
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "test-util"] }
async-trait = "0.1"
tempfile = "3"
armature-testkit = { path = "../armature-testkit", features = ["containers"] }
armature-redis = { path = "../armature-redis", version = "0" }
redis = { version = "1.3", features = ["tokio-comp"] }
serde_json = "1.0"

[features]
default = ["handlebars"]
handlebars = ["dep:handlebars"]
tera = ["dep:tera"]
minijinja = ["dep:minijinja"]
sendgrid = ["reqwest"]
mailgun = ["reqwest"]
ses = ["aws-sdk-sesv2", "aws-config"]
queue = ["chrono"]
redis = ["queue", "armature-redis", "dep:redis"]
all-providers = ["sendgrid", "mailgun", "ses"]
all-templates = ["handlebars", "tera", "minijinja"]
full = ["all-providers", "all-templates", "redis"]

