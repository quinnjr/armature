[package]
name = "armature-core"
version = "0.6.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "High-performance async HTTP framework core - routing, handlers, middleware"
keywords = ["http", "async", "web", "framework"]
categories = ["web-programming::http-server", "asynchronous"]

[dependencies]
armature-log = { path = "../armature-log", version = "0" }
inventory = "0.3"
dependency-injector = "2.1.0"
tokio = { version = "1.52", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "signal"] }
hyper = { version = "1.10", features = ["full"] }
hyper-util = { version = "0.1", features = ["server", "http1", "http2", "tokio"] }
http-body-util = "0.1"
http = "1.4"
tower = { version = "0.5", features = ["util"] }
tower-service = "0.3"
bytes = "1.12"
smallvec = { version = "1.15", features = ["union", "const_generics"] }
compact_str = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# SIMD-optimized HTTP parsing (uses SIMD on x86/x86_64 with std)
httparse = "1.10"
memchr = "2.8"  # SIMD-optimized byte search

# Optional SIMD JSON - significantly faster on x86_64 with AVX2
simd-json = { version = "0.17", optional = true }

# Arena allocator for per-request batch allocations
bumpalo = { version = "3.20", features = ["collections"] }
serde_urlencoded = "0.7"
urlencoding = "2.1"  # Fast URL encoding/decoding
httpdate = "1.0"
async-trait = "0.1"
flate2 = "1.1.9"
brotli = "8.0"
zstd = "0.13"
uuid = { version = "1.23", features = ["v4"] }
thiserror = "2.0"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
futures-util = "0.3"
tokio-stream = "0.1"
regex = "1.12"

# Resilience patterns
parking_lot = "0.12"

# Bounded caches
lru = "0.18"

# Hot Module Reload (HMR)
notify = "8.2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
tracing-appender = "0.2"

# TLS/HTTPS support
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
rustls-pemfile = "2.2"
rcgen = { version = "0.14", optional = true }

# HTTP/3 (QUIC) support - optional
quinn = { version = "0.11", optional = true }
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }

# Unix system calls (Linux, macOS, BSD)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# io_uring userspace interface (Linux only, optional)
[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { version = "0.7", optional = true }

[features]
default = []
self-signed-certs = ["rcgen"]
simd-json = ["dep:simd-json"]

# HTTP/3 (QUIC) support - next-gen protocol with multiplexing over UDP
# Requires: quinn, h3, h3-quinn
http3 = ["quinn", "h3", "h3-quinn"]

# io_uring support for Linux (kernel 5.1+)
# Enables the standalone `IoUringRuntime` ring utility in `armature_core::io_uring`
io-uring = ["dep:io-uring"]

[dev-dependencies]
tokio-test = "0.4"

