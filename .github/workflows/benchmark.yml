# Performance Regression Testing
#
# This workflow runs benchmarks and compares against baseline results
# to catch performance regressions automatically.
#
# Features:
# - Runs Criterion benchmarks on PRs and pushes
# - Compares against stored baseline
# - Alerts when performance degrades beyond threshold
# - Updates baseline on main/develop merges
# - Generates performance reports

name: Benchmarks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      update_baseline:
        description: 'Force update benchmark baseline'
        required: false
        default: 'false'
        type: boolean
  schedule:
    # Weekly on Sunday at 3am UTC (staggered from flamegraph.yml's 2am run)
    - cron: '0 3 * * 0'

# Grant GITHUB_TOKEN permissions for benchmark data
# Least privilege at workflow scope: only `update-baseline` pushes, and it
# grants itself `contents: write` explicitly. Every other job here compiles and
# runs PR-authored code (build scripts and proc macros execute at build time).
permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Performance threshold - fail if regression > 15%
  PERFORMANCE_THRESHOLD: 15

# Every bench step below pipes into `tee`. GitHub's implicit shell is `bash -e`
# WITHOUT pipefail, so a failing `cargo bench` would be masked by tee's exit 0
# and the step would go green having measured nothing. Naming `bash` explicitly
# selects `bash --noprofile --norc -eo pipefail`.
defaults:
  run:
    shell: bash

jobs:
  # ============================================================================
  # CORE BENCHMARKS
  # ============================================================================

  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "benchmark"

      - name: Install cargo-criterion
        run: cargo install cargo-criterion --locked

      # ========================================
      # Run Core Benchmarks
      # ========================================

      # Each benchmark lives in the crate it measures, so every invocation is
      # scoped with `-p`. Adding a bench to a crate means adding a step here.

      # NOTE: `regression-check` compares the FIRST `time:` line of this file
      # against a baseline run filtered to "routing". Keep the same filter on
      # both sides or the comparison divides two unrelated benchmarks.
      - name: Run routing benchmarks
        run: |
          mkdir -p target/benchmark-results
          cargo bench -p armature-core --bench internal_overhead -- --noplot --save-baseline pr "routing" 2>&1 | tee target/benchmark-results/routing.txt

      - name: Run arena benchmarks
        run: |
          cargo bench -p armature-core --bench arena -- --noplot --save-baseline pr 2>&1 | tee target/benchmark-results/arena.txt

      - name: Run body benchmarks
        run: |
          cargo bench -p armature-core --bench body -- --noplot --save-baseline pr 2>&1 | tee target/benchmark-results/body.txt

      - name: Run JSON benchmarks
        run: |
          cargo bench -p armature-core --bench json -- --noplot --save-baseline pr 2>&1 | tee target/benchmark-results/json.txt

      - name: Run SIMD parser benchmarks
        run: |
          cargo bench -p armature-core --bench simd_parser -- --noplot --save-baseline pr 2>&1 | tee target/benchmark-results/simd_parser.txt

      - name: Run JWT benchmarks
        run: |
          cargo bench -p armature-jwt --bench jwt -- --noplot --save-baseline pr 2>&1 | tee target/benchmark-results/jwt.txt

      # ========================================
      # Parse and Report Results
      # ========================================

      - name: Parse benchmark results
        id: parse
        run: |
          echo "## 📊 Benchmark Results" > benchmark-summary.md
          echo "" >> benchmark-summary.md
          echo "| Benchmark | Time | Throughput |" >> benchmark-summary.md
          echo "|-----------|------|------------|" >> benchmark-summary.md

          # Parse each benchmark file
          for file in target/benchmark-results/*.txt; do
            name=$(basename "$file" .txt)
            echo "### $name" >> benchmark-summary.md

            # Extract timing information
            grep -E "time:\s+\[" "$file" | while read -r line; do
              bench_name=$(echo "$line" | sed 's/Benchmarking //' | sed 's/time:.*//' | xargs)
              time=$(echo "$line" | grep -oP '\[\K[0-9.]+ [a-z]+' | head -1)
              echo "| $bench_name | $time | - |" >> benchmark-summary.md
            done 2>/dev/null || true
          done

          # Summary statistics
          echo "" >> benchmark-summary.md
          echo "### Summary" >> benchmark-summary.md
          echo "" >> benchmark-summary.md
          echo "- Commit: \`${{ github.sha }}\`" >> benchmark-summary.md
          echo "- Branch: \`${{ github.ref_name }}\`" >> benchmark-summary.md
          echo "- Runner: \`${{ runner.os }}\`" >> benchmark-summary.md

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ github.sha }}
          path: |
            target/benchmark-results/
            benchmark-summary.md
          retention-days: 30

      # ========================================
      # Comment on PR
      # ========================================

      - name: Comment benchmark results on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let summary = '';
            try {
              summary = fs.readFileSync('benchmark-summary.md', 'utf8');
            } catch (e) {
              summary = '⚠️ Could not read benchmark summary';
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('📊 Benchmark Results')
            );

            const body = summary + '\n\n---\n*Benchmark run triggered by commit ' + context.sha.substring(0, 7) + '*';

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  # ============================================================================
  # REGRESSION DETECTION
  # ============================================================================

  regression-check:
    name: Regression Detection
    runs-on: ubuntu-latest
    needs: benchmark
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "benchmark"

      - name: Download PR benchmark results
        uses: actions/download-artifact@v8
        with:
          name: benchmark-results-${{ github.sha }}
          path: pr-results

      # Both benchmarks below live inside the `armature-core` submodule, and
      # `git checkout <base> -- .` moves a gitlink without touching the
      # submodule working tree — the baseline would silently be the PR's own
      # code. A second checkout into `base/` with `submodules: recursive` is
      # the supported way to get a real base tree (git's own manual warns that
      # submodules in a linked worktree are unsupported, so `git worktree` is
      # not an option here). Same pattern as flamegraph.yml's `differential`.
      - name: Check out base branch
        uses: actions/checkout@v6
        with:
          submodules: recursive
          ref: ${{ github.base_ref }}
          path: base

      - name: Run baseline benchmarks
        working-directory: base
        run: |
          mkdir -p ../base-results
          # Run quick subset of benchmarks for comparison. A base branch that
          # predates the per-crate benchmark move has no `internal_overhead`
          # target; leave the file absent rather than writing an error into it,
          # so the comparison step can tell "no baseline" from "measured 0".
          cargo bench -p armature-core --bench internal_overhead -- --noplot "routing" 2>&1 | tee ../base-results/routing.txt || rm -f ../base-results/routing.txt
          cargo bench -p armature-core --bench arena -- --noplot "request_create" 2>&1 | tee ../base-results/arena.txt || rm -f ../base-results/arena.txt

      - name: Compare benchmarks
        id: compare
        run: |
          echo "## 🔍 Performance Regression Analysis" > regression-report.md
          echo "" >> regression-report.md

          # Simple comparison - check for significant slowdowns
          REGRESSIONS=0

          # Parse PR results. A missing or timing-free baseline file means the
          # baseline never ran (e.g. the base branch predates a bench rename) —
          # that is a broken check, not a passing one, so say so loudly instead
          # of silently reporting "no regressions".
          BASELINE_OK=1
          if [ ! -s "base-results/routing.txt" ] || ! grep -q 'time:' base-results/routing.txt; then
            BASELINE_OK=0
            echo "::warning::baseline benchmark produced no timings; regression comparison skipped"
            echo "> ⚠️ Baseline benchmark produced no timings — comparison skipped, this run proves nothing." >> regression-report.md
          fi

          if [ -f "pr-results/target/benchmark-results/routing.txt" ]; then
            # `grep -m1` rather than `| head -1`: under pipefail a closed pipe
            # makes grep exit 141, which would turn the fallback into a second
            # line of output rather than a substitution.
            PR_TIME=$(grep -m1 -oP 'time:\s+\[\K[0-9.]+' pr-results/target/benchmark-results/routing.txt || true)
            BASE_TIME=$(grep -m1 -oP 'time:\s+\[\K[0-9.]+' base-results/routing.txt 2>/dev/null || true)
            PR_TIME=${PR_TIME:-0}
            BASE_TIME=${BASE_TIME:-0}

            if [ "$PR_TIME" != "0" ] && [ "$BASE_TIME" != "0" ]; then
              # Calculate percentage change
              CHANGE=$(echo "scale=2; (($PR_TIME - $BASE_TIME) / $BASE_TIME) * 100" | bc 2>/dev/null || echo "0")
              echo "| Routing | ${BASE_TIME}ns | ${PR_TIME}ns | ${CHANGE}% |" >> regression-report.md

              # Check threshold
              if (( $(echo "$CHANGE > $PERFORMANCE_THRESHOLD" | bc -l 2>/dev/null || echo 0) )); then
                echo "::warning::Performance regression detected in routing: ${CHANGE}% slower"
                REGRESSIONS=$((REGRESSIONS + 1))
              fi
            fi
          fi

          echo "" >> regression-report.md

          if [ $REGRESSIONS -gt 0 ]; then
            echo "::warning::Found $REGRESSIONS performance regression(s) exceeding ${PERFORMANCE_THRESHOLD}% threshold"
            echo "regression_detected=true" >> $GITHUB_OUTPUT
          elif [ "$BASELINE_OK" -eq 0 ]; then
            # Must not read as a pass: nothing was compared.
            echo "> Result: **inconclusive** — no baseline to compare against." >> regression-report.md
            echo "regression_detected=false" >> $GITHUB_OUTPUT
          else
            echo "✅ No significant performance regressions detected" >> regression-report.md
            echo "regression_detected=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload regression report
        uses: actions/upload-artifact@v7
        with:
          name: regression-report-${{ github.sha }}
          path: regression-report.md
          retention-days: 30

      # ADVISORY BY DESIGN — this step deliberately does not fail the build.
      # Criterion numbers on shared CI runners are too noisy to gate a merge on,
      # so a regression surfaces as an annotation plus the uploaded report and a
      # human decides. Do not add `exit 1` here without first making the
      # measurement reproducible (dedicated runner, or `--save-baseline` over
      # several runs); a flaky blocking gate gets disabled, which is worse than
      # an advisory one.
      - name: Report regression (advisory, does not fail the build)
        if: steps.compare.outputs.regression_detected == 'true'
        run: |
          echo "⚠️ Performance regression detected!"
          echo "Please review the benchmark results and optimize the affected code."

  # ============================================================================
  # BASELINE UPDATE
  # ============================================================================

  update-baseline:
    name: Update Baseline
    runs-on: ubuntu-latest
    # The only job here that writes to the repo.
    permissions:
      contents: write
    needs: benchmark
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.update_baseline == 'true')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Download benchmark results
        uses: actions/download-artifact@v8
        with:
          name: benchmark-results-${{ github.sha }}
          path: benchmark-results

      # NOTE: `.github/benchmark-baseline/` is an archived record of past runs,
      # not an input — nothing reads it back. `regression-check` re-measures the
      # base branch in a worktree instead. Do not hand-edit these files.
      - name: Create baseline data
        run: |
          mkdir -p .github/benchmark-baseline
          # Replace, don't merge: a renamed bench step would otherwise strand
          # its old output here forever (as `security.txt` did when the step
          # became `jwt`).
          rm -f .github/benchmark-baseline/*.txt
          cp benchmark-results/target/benchmark-results/*.txt .github/benchmark-baseline/

          # Create summary JSON
          cat > .github/benchmark-baseline/baseline.json << EOF
          {
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "runner": "${{ runner.os }}"
          }
          EOF

      - name: Commit baseline update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/benchmark-baseline/
          # The `git diff --staged --quiet ||` guard already handles the
          # genuine no-op case, so a bare push fails only on real errors —
          # don't relabel those as "no changes".
          git diff --staged --quiet && exit 0
          git commit -m "chore: update benchmark baseline [skip ci]"
          git push

  # ============================================================================
  # PERFORMANCE TRENDS (Weekly)
  # ============================================================================

  performance-trends:
    name: Performance Trends Report
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run comprehensive benchmarks
        run: |
          mkdir -p trend-results
          # Benchmarks are owned by the crates they measure; the root package
          # keeps only the framework-comparison ones.
          cargo bench \
            -p armature-core \
            -p armature-h1 \
            -p armature-jwt \
            -p armature-auth \
            -p armature-validation \
            -p armature-cache \
            -p armature-cron \
            -p armature-queue \
            -p armature-ratelimit \
            -p armature-storage \
            -p armature-http-client \
            -p armature-framework \
            -- --noplot 2>&1 | tee trend-results/full-bench.txt

      - name: Generate trends report
        run: |
          echo "# Performance Trends Report" > PERFORMANCE_TRENDS.md
          echo "" >> PERFORMANCE_TRENDS.md
          echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> PERFORMANCE_TRENDS.md
          echo "" >> PERFORMANCE_TRENDS.md
          echo "## Current Benchmarks" >> PERFORMANCE_TRENDS.md
          echo "" >> PERFORMANCE_TRENDS.md
          echo "\`\`\`" >> PERFORMANCE_TRENDS.md
          # `|| true`: head closes the pipe, grep takes SIGPIPE, and this
          # workflow runs with pipefail.
          grep -E "(Benchmarking|time:)" trend-results/full-bench.txt | head -100 >> PERFORMANCE_TRENDS.md || true
          echo "\`\`\`" >> PERFORMANCE_TRENDS.md

      - name: Upload trends report
        uses: actions/upload-artifact@v7
        with:
          name: performance-trends-${{ github.run_id }}
          path: |
            PERFORMANCE_TRENDS.md
            trend-results/
          retention-days: 90

