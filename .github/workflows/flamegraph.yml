# Flame Graph Generation
#
# This workflow generates CPU flame graphs for performance analysis.
# Flame graphs help visualize where CPU time is spent in the framework.
#
# Features:
# - Auto-generates flamegraphs on demand
# - Uploads SVG artifacts for visual inspection
# - Compares flamegraphs between branches (on PRs)
# - Weekly scheduled runs to track trends

name: Flame Graphs

on:
  workflow_dispatch:
    inputs:
      benchmark:
        description: 'Benchmark to profile'
        required: false
        default: 'internal_overhead'
        type: choice
        options:
          - internal_overhead
          - core
          - json
          - simd_parser
          - all
      duration:
        description: 'Profile duration (seconds, digits only)'
        required: false
        default: '30'
        type: string
  pull_request:
    branches: [main, develop]
    paths:
      # `armature-core` is a submodule: in THIS repo it is a single gitlink
      # entry, so `armature-core/**` globs can never match. A change to core
      # (source or benches) reaches here as a bump of the gitlink itself.
      - 'armature-core'
      - 'benches/**'
      - '.github/workflows/flamegraph.yml'
  schedule:
    # Weekly on Sunday at 2am UTC
    - cron: '0 2 * * 0'

# No job here writes to the repo; both compile and run PR-authored code.
permissions:
  contents: read
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

# Several steps below pipe into `tee`. GitHub's implicit shell is `bash -e`
# without pipefail, which would let a failed `cargo bench` be masked by tee's
# exit 0. Naming bash explicitly selects `bash --noprofile --norc -eo pipefail`.
defaults:
  run:
    shell: bash

jobs:
  # ============================================================================
  # GENERATE FLAME GRAPHS
  # ============================================================================

  flamegraph:
    name: Generate Flame Graphs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-tools-common linux-tools-generic linux-tools-$(uname -r) || true
          # Install perf if available
          sudo apt-get install -y linux-perf || true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "flamegraph"

      - name: Install flamegraph tools
        run: |
          cargo install flamegraph --locked
          cargo install inferno --locked

      - name: Build release binaries
        run: |
          cargo build --release --features full
          # Benchmarks live in the crates they measure, hence the `-p` scoping.
          # These are tolerated failures, but the reason must reach the log:
          # a wrong `-p`/`--bench` pair is exactly what a silenced stderr hides.
          cargo build --release -p armature-core --bench internal_overhead
          cargo build --release -p armature-core --bench core || true
          cargo build --release -p armature-core --bench json || true
          cargo build --release -p armature-core --bench simd_parser || true

      # Unconditional: the four profiling steps below are each gated on a
      # different `benchmark` input, so creating this inside any one of them
      # leaves the others writing into a directory that does not exist.
      - name: Create flamegraph output directory
        run: mkdir -p flamegraphs

      - name: Configure kernel for profiling
        run: |
          # Allow perf events
          echo 0 | sudo tee /proc/sys/kernel/perf_event_paranoid || true
          echo 0 | sudo tee /proc/sys/kernel/kptr_restrict || true

      - name: Generate internal_overhead flamegraph
        if: ${{ github.event.inputs.benchmark == 'internal_overhead' || github.event.inputs.benchmark == 'all' || github.event_name != 'workflow_dispatch' }}
        env:
          DURATION: ${{ github.event.inputs.duration || '30' }}
        run: |
          # Bound through env, not template splicing: a `workflow_dispatch`
          # string input interpolated straight into `run:` is a shell-injection
          # sink. Validate before use — `timeout` only accepts a number anyway.
          [[ "$DURATION" =~ ^[0-9]+$ ]] || { echo "::error::duration must be digits"; exit 1; }

          # Try to use perf-based flamegraph first
          timeout "${DURATION}s" \
            cargo flamegraph -p armature-core --bench internal_overhead \
            -o flamegraphs/internal_overhead.svg \
            -- --bench "routing" 2>&1 || {
              # Fallback: use dtrace/sampling if perf not available
              echo "Perf unavailable, trying alternative profiling..."
              cargo bench -p armature-core --bench internal_overhead -- --profile-time 10 2>&1 | tee flamegraphs/internal_overhead.txt || true
            }

      - name: Generate core flamegraph
        if: ${{ github.event.inputs.benchmark == 'core' || github.event.inputs.benchmark == 'all' }}
        env:
          DURATION: ${{ github.event.inputs.duration || '30' }}
        run: |
          [[ "$DURATION" =~ ^[0-9]+$ ]] || { echo "::error::duration must be digits"; exit 1; }
          timeout "${DURATION}s" \
            cargo flamegraph -p armature-core --bench core \
            -o flamegraphs/core.svg 2>&1 || true

      - name: Generate JSON benchmarks flamegraph
        if: ${{ github.event.inputs.benchmark == 'json' || github.event.inputs.benchmark == 'all' }}
        env:
          DURATION: ${{ github.event.inputs.duration || '30' }}
        run: |
          [[ "$DURATION" =~ ^[0-9]+$ ]] || { echo "::error::duration must be digits"; exit 1; }
          timeout "${DURATION}s" \
            cargo flamegraph -p armature-core --bench json \
            -o flamegraphs/json.svg 2>&1 || true

      - name: Generate SIMD parser flamegraph
        if: ${{ github.event.inputs.benchmark == 'simd_parser' || github.event.inputs.benchmark == 'all' }}
        env:
          DURATION: ${{ github.event.inputs.duration || '30' }}
        run: |
          [[ "$DURATION" =~ ^[0-9]+$ ]] || { echo "::error::duration must be digits"; exit 1; }
          timeout "${DURATION}s" \
            cargo flamegraph -p armature-core --bench simd_parser \
            -o flamegraphs/simd_parser.svg 2>&1 || true

      # ========================================
      # Generate Summary
      # ========================================

      # Every profiling step above ends in `|| true`, so without this gate the
      # job can produce zero output and still report success.
      - name: Assert profiling produced output
        run: |
          shopt -s nullglob
          # Non-empty, not merely present: the .txt fallback is written by
          # `tee`, which creates the file before `cargo bench` produces a
          # single byte. A 0-byte file is a failed run, not output.
          produced=()
          for f in flamegraphs/*.svg flamegraphs/*.txt; do
            [ -s "$f" ] && produced+=("$f")
          done
          if [ ${#produced[@]} -eq 0 ]; then
            echo "::error::no non-empty flamegraph or profile output was produced"
            exit 1
          fi
          printf 'produced %d artifact(s)\n' "${#produced[@]}"

      - name: Create flamegraph summary
        run: |
          echo "# 🔥 Flame Graph Report" > flamegraphs/README.md
          echo "" >> flamegraphs/README.md
          echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> flamegraphs/README.md
          echo "Commit: \`${{ github.sha }}\`" >> flamegraphs/README.md
          echo "Branch: \`${{ github.ref_name }}\`" >> flamegraphs/README.md
          echo "" >> flamegraphs/README.md
          echo "## Generated Flame Graphs" >> flamegraphs/README.md
          echo "" >> flamegraphs/README.md
          
          for svg in flamegraphs/*.svg; do
            if [ -f "$svg" ]; then
              name=$(basename "$svg" .svg)
              size=$(du -h "$svg" | cut -f1)
              echo "- **${name}** (${size})" >> flamegraphs/README.md
            fi
          done
          
          echo "" >> flamegraphs/README.md
          echo "## How to View" >> flamegraphs/README.md
          echo "" >> flamegraphs/README.md
          echo "1. Download the SVG artifact below" >> flamegraphs/README.md
          echo "2. Open in a browser (they're interactive!)" >> flamegraphs/README.md
          echo "3. Click on functions to zoom in" >> flamegraphs/README.md
          echo "4. Look for wide bars - those are the hot spots" >> flamegraphs/README.md

      - name: Upload flamegraph artifacts
        uses: actions/upload-artifact@v7
        with:
          name: flamegraphs-${{ github.sha }}
          path: flamegraphs/
          retention-days: 30

      # ========================================
      # Comment on PR
      # ========================================

      - name: Comment flamegraph on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let readme = '';
            try {
              readme = fs.readFileSync('flamegraphs/README.md', 'utf8');
            } catch (e) {
              readme = '⚠️ Could not read flamegraph summary';
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('🔥 Flame Graph Report')
            );

            const artifactUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = readme + '\n\n📥 [Download Flame Graphs](' + artifactUrl + ')\n\n---\n*Generated for commit ' + context.sha.substring(0, 7) + '*';

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  # ============================================================================
  # DIFFERENTIAL FLAME GRAPHS (PR only)
  # ============================================================================

  differential:
    name: Differential Flame Graph
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          submodules: recursive
          path: pr

      - name: Checkout base branch
        uses: actions/checkout@v6
        with:
          submodules: recursive
          ref: ${{ github.base_ref }}
          path: base

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install tools
        run: |
          cargo install inferno --locked

      - name: Profile PR branch
        working-directory: pr
        run: |
          cargo build --release --features full
          # Create a simple test to profile
          cargo bench -p armature-core --bench internal_overhead -- --profile-time 5 > /tmp/pr-profile.txt 2>&1 || true

      - name: Profile base branch
        working-directory: base
        run: |
          cargo build --release --features full || true
          cargo bench -p armature-core --bench internal_overhead -- --profile-time 5 > /tmp/base-profile.txt 2>&1 || true

      - name: Generate diff summary
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          mkdir -p diff-report
          echo "# Differential Analysis" > diff-report/README.md
          echo "" >> diff-report/README.md
          echo "Comparing \`$HEAD_REF\` against \`$BASE_REF\`" >> diff-report/README.md
          echo "" >> diff-report/README.md
          
          # Compare benchmark outputs
          if [ ! -s /tmp/pr-profile.txt ] || [ ! -s /tmp/base-profile.txt ]; then
            echo "::warning::one or both profile captures are empty; the diff below proves nothing"
            echo "> ⚠️ One or both profile runs produced no output." >> diff-report/README.md
          fi

          if [ -f /tmp/pr-profile.txt ] && [ -f /tmp/base-profile.txt ]; then
            echo "## Benchmark Comparison" >> diff-report/README.md
            echo "\`\`\`" >> diff-report/README.md
            diff /tmp/base-profile.txt /tmp/pr-profile.txt | head -50 >> diff-report/README.md || echo "No significant differences" >> diff-report/README.md
            echo "\`\`\`" >> diff-report/README.md
          fi

      - name: Upload diff report
        uses: actions/upload-artifact@v7
        with:
          name: flamegraph-diff-${{ github.sha }}
          path: diff-report/
          retention-days: 14

