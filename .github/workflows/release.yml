# GitHub Actions Release Pipeline for Armature Framework

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================================
  # BUILD RELEASE ARTIFACTS
  # ============================================================================

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # SAML (armature-auth's `saml` feature -> samael -> openssl-sys +
          # system xmlsec1) has never been built/tested on anything but
          # Linux glibc in this project (see the Linux-only `test-saml` job
          # in ci.yml) -- cross-compiling xmlsec1/openssl for musl, or
          # building them on Windows/macOS, is unproven and out of scope
          # here. Only the gnu target builds with every feature (including
          # saml); the rest build every feature EXCEPT saml.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            feature_flag: --all-features
          # Kafka (rdkafka-sys, a C/C++ build via cmake) additionally needs
          # a musl-targeted C++ cross-compiler that `musl-tools` doesn't
          # provide -- drop `messaging-kafka`/`messaging-full` (which
          # transitively enables kafka via armature-messaging's own `full`
          # feature) on musl too.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            feature_flag: --features full,messaging-rabbitmq,messaging-nats,simd-json,memory-profiling
          - target: x86_64-apple-darwin
            os: macos-latest
            feature_flag: --features full,messaging-kafka,messaging-rabbitmq,messaging-nats,messaging-full,simd-json,memory-profiling
          - target: aarch64-apple-darwin
            os: macos-latest
            feature_flag: --features full,messaging-kafka,messaging-rabbitmq,messaging-nats,messaging-full,simd-json,memory-profiling
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            feature_flag: --features full,messaging-kafka,messaging-rabbitmq,messaging-nats,messaging-full,simd-json,memory-profiling
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install musl tools (Linux musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # SAML (xmlsec1) and Kafka (rdkafka-sys, via libcurl) system deps --
      # only needed on the gnu target, which is the only one building with
      # --all-features (see matrix comment above).
      - name: Install SAML/Kafka system dependencies (Linux gnu)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxmlsec1-dev libxmlsec1-openssl libcurl4-openssl-dev pkg-config

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} ${{ matrix.feature_flag }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: armature-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/

  # ============================================================================
  # CREATE GITHUB RELEASE
  # ============================================================================

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          body: |
            # Armature ${{ github.ref_name }}

            See [CHANGELOG.md](https://github.com/quinnjr/armature/blob/main/CHANGELOG.md) for details.

            ## Installation

            ```toml
            [dependencies]
            armature = "${{ github.ref_name }}"
            ```
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # PUBLISH TO CRATES.IO
  # ============================================================================

  publish:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    # Required by both scripts/publish.sh and the final bare 'cargo publish' step below —
    # both read this env var natively, neither takes an explicit --token flag.
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Publishes all workspace member crates in dependency-topological order
      # (see scripts/publish.sh for the ordering logic and rate-limit handling).
      - name: Publish workspace crates
        run: ./scripts/publish.sh --yes

      - name: Wait for crates.io indexing
        run: sleep 60

      # The workspace root is a mixed manifest: package name is "armature-framework"
      # (the crates.io package), while [lib] name = "armature" is only the library's
      # import name. It depends on the workspace member crates published above, so
      # it must be published last.
      - name: Publish armature-framework (root crate)
        run: cargo publish -p armature-framework

