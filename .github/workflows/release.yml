# GitHub Actions Release Pipeline for Armature Framework

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================================
  # BUILD RELEASE ARTIFACTS
  # ============================================================================

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install musl tools (Linux musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --all-features

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: armature-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/

  # ============================================================================
  # CREATE GITHUB RELEASE
  # ============================================================================

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          body: |
            # Armature ${{ github.ref_name }}

            See [CHANGELOG.md](https://github.com/quinnjr/armature/blob/main/CHANGELOG.md) for details.

            ## Installation

            ```toml
            [dependencies]
            armature = "${{ github.ref_name }}"
            ```
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # PUBLISH TO CRATES.IO
  # ============================================================================

  publish:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    # Required by both scripts/publish.sh and the final bare 'cargo publish' step below —
    # both read this env var natively, neither takes an explicit --token flag.
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Publishes all workspace member crates in dependency-topological order
      # (see scripts/publish.sh for the ordering logic and rate-limit handling).
      - name: Publish workspace crates
        run: ./scripts/publish.sh --yes

      - name: Wait for crates.io indexing
        run: sleep 60

      # The workspace root is a mixed manifest: package name is "armature-framework"
      # (the crates.io package), while [lib] name = "armature" is only the library's
      # import name. It depends on the workspace member crates published above, so
      # it must be published last.
      - name: Publish armature-framework (root crate)
        run: cargo publish -p armature-framework

