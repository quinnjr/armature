# GitHub Actions Release Pipeline for Armature Framework

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================================
  # CREATE GITHUB RELEASE
  #
  # No binary artifacts are attached: armature-framework's root package is a
  # library (no [[bin]] target), and the prior per-platform build+upload
  # machinery existed solely to attach files here -- it uploaded the entire
  # `target/<target>/release/` directory (every intermediate .o/.rlib/header
  # from every dependency, thousands of files) as individual release assets,
  # which was both meaningless (nothing there was a real deliverable) and
  # unreliable (frequent transient network failures from the sheer number of
  # uploads). The actual deliverable is the crates.io publish below.
  # ============================================================================

  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          body: |
            # Armature ${{ github.ref_name }}

            See [CHANGELOG.md](https://github.com/quinnjr/armature/blob/main/CHANGELOG.md) for details.

            ## Installation

            ```toml
            [dependencies]
            armature = "${{ github.ref_name }}"
            ```
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # PUBLISH TO CRATES.IO
  # ============================================================================

  publish:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    # Required by both scripts/publish.sh and the final bare 'cargo publish' step below —
    # both read this env var natively, neither takes an explicit --token flag.
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Publishes all workspace member crates in dependency-topological order
      # (see scripts/publish.sh for the ordering logic and rate-limit handling).
      - name: Publish workspace crates
        run: ./scripts/publish.sh --yes

      - name: Wait for crates.io indexing
        run: sleep 60

      # The workspace root is a mixed manifest: package name is "armature-framework"
      # (the crates.io package), while [lib] name = "armature" is only the library's
      # import name. It depends on the workspace member crates published above, so
      # it must be published last.
      - name: Publish armature-framework (root crate)
        run: cargo publish -p armature-framework

