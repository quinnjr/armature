# Security Audit Configuration
# https://docs.rs/cargo-audit/latest/cargo_audit/

[advisories]
# Vulnerabilities and warnings to ignore (with justification)
ignore = [
    #
    # === SECURITY VULNERABILITIES ===
    #

    # RUSTSEC-2023-0071: rsa - Marvin Attack timing sidechannel
    # Status: NO FIX AVAILABLE
    # Impact: Low - Transitive dependency from sqlx-mysql (dev-dependency only)
    # The vulnerability requires local timing measurements which is not applicable
    "RUSTSEC-2023-0071",

    # RUSTSEC-2024-0363: sqlx - Binary Protocol Misinterpretation  
    # Status: Fix requires sqlx >= 0.8.1, but latest stable is 0.7.4
    # Impact: Low - sqlx is only a dev-dependency used for examples
    # Action: Will upgrade when 0.8.x becomes stable
    "RUSTSEC-2024-0363",

    # RUSTSEC-2024-0437: protobuf - Crash due to uncontrolled recursion
    # Status: Fix requires protobuf >= 3.7.2, but opentelemetry-prometheus 0.15 uses 2.x
    # Impact: Medium - Requires malicious protobuf input to trigger
    # Action: Will address when upgrading opentelemetry ecosystem to 0.31.x
    "RUSTSEC-2024-0437",

    # RUSTSEC-2026-0049 / 0098 / 0099 / 0104: rustls-webpki < 0.103.x - CRL
    # parsing panics and related certificate-verification issues.
    # Status: Old webpki versions are pinned by external optional integrations:
    #   - rustls 0.21 via mq-bridge's internal aws-config (default features)
    #   - rustls 0.22 via rumqttc 0.25 (latest release; no fixed version exists)
    # First-party AWS crates now use default-https-client (rustls 0.23 /
    # webpki 0.103, which is patched). The vulnerable versions only enter
    # builds that opt into the mq-bridge/mqtt integrations.
    # Action: Re-check when mq-bridge updates its aws-config defaults and
    # rumqttc releases a rustls >= 0.23 version.
    "RUSTSEC-2026-0049",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",

    #
    # === UNMAINTAINED CRATE WARNINGS ===
    #

    # RUSTSEC-2024-0388: derivative - unmaintained
    # Used by: sea-query (dev-dependency via sea-orm)
    "RUSTSEC-2024-0388",
    
    # RUSTSEC-2025-0119: number_prefix - unmaintained
    # Used by: indicatif (CLI dependency)
    "RUSTSEC-2025-0119",
    
    # RUSTSEC-2025-0123: opentelemetry-jaeger - unmaintained
    # Used by: armature-opentelemetry (optional feature)
    # Note: Deprecated in favor of OTLP. We provide OTLP as default.
    "RUSTSEC-2025-0123",
    
    # RUSTSEC-2024-0436: paste - unmaintained
    # Used by: sqlx-core (dev-dependency)
    "RUSTSEC-2024-0436",
    
    # RUSTSEC-2024-0370: proc-macro-error - unmaintained
    # Used by: ouroboros via sea-orm (dev-dependency)
    "RUSTSEC-2024-0370",
    
    # RUSTSEC-2025-0134: rustls-pemfile - unmaintained
    # Used by: reqwest, armature-core, armature-acme
    # Note: Core functionality, will monitor for alternatives
    "RUSTSEC-2025-0134",

    #
    # === 2026 advisories (transitive; no takeable fix without upstream bumps) ===
    #

    # RUSTSEC-2026-0049 / -0098 / -0099 / -0104: rustls-webpki - name-constraint /
    # wildcard-name verification issues. Pulled transitively through the rustls
    # 0.23 stack (reqwest / tokio-rustls). A fresh resolve still selects the
    # affected line because intermediate crates cap the version; will pick up the
    # >=0.103.13 fix when the rustls ecosystem deps release compatible bumps.
    "RUSTSEC-2026-0049",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",

    # RUSTSEC-2026-0187: lopdf - stack overflow via deeply nested PDF objects.
    # Transitive via armature-files PDF support; fix is lopdf >=0.42.0, held back
    # by the intermediate dependency. PDF parsing is an opt-in feature.
    "RUSTSEC-2026-0187",

    # RUSTSEC-2026-0194 / -0195: quick-xml - quadratic attribute-check /
    # unbounded namespace-declaration DoS. Reaches us only through `samael`
    # (behind the opt-in `saml` feature); samael pins quick-xml below the
    # >=0.41.0 fix. SAML XML is bounded by upstream request-body limits. Will
    # drop this ignore once samael releases against quick-xml >=0.41.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",

    # RUSTSEC-2026-0235: rkyv - insufficient archive validation allows
    # out-of-bounds reads for archives containing Rc/Arc. Reaches us only as
    # rkyv 0.7.46 under `rust_decimal`, which is itself pulled by `sea-orm` and
    # `sqlx` — both dev-dependencies. `cargo tree -e normal` for
    # armature-framework does not contain `rust_decimal` at all, so no shipped
    # code path can hand rkyv an archive, and nothing here deserializes rkyv
    # archives in the first place. The fix is rkyv >=0.8.17, which rust_decimal
    # does not yet allow; drop this once it releases against 0.8.
    "RUSTSEC-2026-0235",

    # RUSTSEC-2026-0253: lru < 0.18.2 - `LruCache::pop()` is not panic-safe
    # (use-after-free if a key's `Drop` panics under `catch_unwind`). Our own
    # crates already require lru 0.18. The 0.16 line still enters through
    # launchdarkly-server-sdk (every release, 3.2.0 included, requires ^0.16.3;
    # armature-features' opt-in `launchdarkly` feature) and mysql_async 0.36,
    # which diesel-async 0.9.2, its newest release, pins (armature-diesel's `mysql`
    # feature). Neither upstream stores keys with a panicking `Drop`. Drop this
    # once both release against lru >= 0.18.2.
    "RUSTSEC-2026-0253",

    # RUSTSEC-2026-0249: smartstring - unmaintained (repository archived).
    # Used by: rhai (every release depends on it), via armature-rhai / armature-app.
    # Drop when rhai replaces it.
    "RUSTSEC-2026-0249",

    # RUSTSEC-2026-0192: ttf-parser - unmaintained.
    # Used by: ab_glyph / owned_ttf_parser (newest releases), via armature-files'
    # default `images` feature for text watermarks. Drop when ab_glyph moves to a
    # maintained parser such as skrifa.
    "RUSTSEC-2026-0192",

    # RUSTSEC-2025-0057 / RUSTSEC-2024-0384: fxhash / instant - unmaintained.
    # Used by: sled 0.34.7 (newest release), which mq-bridge enables through its
    # `dedup`/`sled` features; reached only via armature-messaging's opt-in
    # `mq-bridge-full`. Drop when mq-bridge moves off sled 0.34.
    "RUSTSEC-2025-0057",
    "RUSTSEC-2024-0384",
]
