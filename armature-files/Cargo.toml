[package]
name = "armature-files"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "File processing pipeline for Armature framework - images, PDFs, and format conversion"
keywords = ["image", "pdf", "file-processing", "media", "conversion"]
categories = ["multimedia::images", "web-programming"]
# The vendored watermark font lives outside `src/`; without it in `include` the
# `include_bytes!` in `src/image.rs` breaks in the published tarball.
include = [
    "src/**/*.rs",
    "tests/**/*.rs",
    "assets/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE*",
]

[dependencies]
# NB: this crate deliberately does *not* depend on `armature-core`. It is a
# standalone file-processing library with no request/response, routing or
# runtime surface, and pulling `armature-core` in for zero call sites cost
# ~140 extra transitive crates on every build.
tokio = { version = "1.52", features = ["rt-multi-thread", "fs", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
thiserror = "2.0"
bytes = "1.12"
mime = "0.3"
mime_guess = "2.0"

# Image processing
#
# `default-features = false` deliberately: the default feature set drags in
# `ravif`/`rav1e` (AVIF) and `exr`, codecs this crate never encodes or decodes,
# and `rav1e` is one of the slowest-compiling crates in the ecosystem. Only the
# codecs actually reachable from `OutputFormat` are enabled.
image = { version = "0.25", optional = true, default-features = false, features = [
    "bmp",
    "gif",
    "ico",
    "jpeg",
    "png",
    "rayon",
    "tiff",
    "webp",
] }
# `default-features = false` deliberately: imageproc's default feature set
# turns on `image/default`, which re-enables the AVIF (`ravif`/`rav1e`) and
# `exr` codecs this crate never touches. `text` is required for
# `drawing::draw_text_mut`; `fft`/`display-window` are not used.
imageproc = { version = "0.27", optional = true, default-features = false, features = [
    "rayon",
    "text",
] }
ab_glyph = { version = "0.2", optional = true }

# PDF generation.
#
# `printpdf` is deliberately absent: `PdfBuilder` assembles content streams and
# serializes them with `lopdf` directly, and printpdf had zero call sites.
lopdf = { version = "0.43", optional = true }

# Additional formats
zip = { version = "8.6", optional = true }
# `ZipExtractor::extract_to` stages into a temporary directory inside the target
# so a failed extraction leaves nothing behind; a failure while promoting the
# staged entries is rolled back (best-effort) rather than left half-applied.
tempfile = { version = "3.27", optional = true }

[features]
default = ["images", "embedded-font"]
images = ["image", "imageproc", "ab_glyph"]
# Embed `assets/fonts/DejaVuSans.ttf` (~760 KB) as the fallback font for text
# watermarks. Turn this off and supply your own font via
# `Pipeline::with_font` / `ImageOp::TextWatermark { font, .. }`.
embedded-font = []
pdf = ["lopdf"]
archives = ["zip", "tempfile"]
full = ["images", "embedded-font", "pdf", "archives"]

[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread"] }
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "gif",
    "ico",
    "jpeg",
    "png",
    "tiff",
    "webp",
] }
lopdf = { version = "0.43" }
zip = { version = "8.6" }

