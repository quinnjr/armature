# cargo-deny configuration — run as `cargo deny --workspace --all-features check`
# (CI: the `security-audit` job in .github/workflows/ci.yml).
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
# Keep this list identical to .cargo/audit.toml; every entry there carries the
# justification and the condition for dropping it.
ignore = [
    "RUSTSEC-2023-0071",
    "RUSTSEC-2026-0049",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    "RUSTSEC-2026-0382",
    "RUSTSEC-2026-0387",
    "RUSTSEC-2025-0134",
    "RUSTSEC-2024-0449",
    "RUSTSEC-2026-0249",
    "RUSTSEC-2026-0192",
    "RUSTSEC-2025-0057",
    "RUSTSEC-2024-0384",
    "RUSTSEC-2026-0374",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2026-0253",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Path dependencies inside the workspace are not wildcards.
allow-wildcard-paths = true
deny = [
    # TLS is rustls-only (AGENTS.md). native-tls drags in OpenSSL.
    { crate = "native-tls", reason = "TLS is rustls-only; use the rustls feature of the dependency" },
    # OpenSSL is allowed only behind these opt-in features, which have no
    # rustls equivalent upstream: SAML signatures (samael, `saml`), WebAuthn
    # attestation (webauthn-rs, `webauthn`), Web Push payload encryption (ece,
    # armature-push `web-push`) and memcached TLS (memcache,
    # armature-session `memcached-tls`).
    { crate = "openssl", wrappers = ["samael", "webauthn-rs-core", "webauthn-attestation-ca", "ece", "memcache"], reason = "TLS is rustls-only; OpenSSL only via the documented opt-in features" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licenses only. Dual-licensed crates (e.g. "Apache-2.0 OR
# GPL-2.0-only") pass on their permissive alternative.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "BlueOak-1.0.0",
    "bzip2-1.0.6",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
# The benchmark comparison servers are workspace members that are never
# published.
ignore = true
