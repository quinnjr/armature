[package]
name = "armature-macros"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Declarative macros for Armature framework"
keywords = ["macros", "framework", "web"]
categories = ["web-programming", "development-tools::procedural-macro-helpers"]

[dependencies]
armature-core = { path = "../armature-core", version = "0.2.1" }
serde_json = "1.0"
# Required by the `log_error!` macro, which expands to `tracing::error!(...)`.
# `macro_rules!` paths to external crates resolve against the *defining*
# crate's dependency graph, so this must be a normal (non-dev) dependency
# for `log_error!` to compile for any caller.
tracing = "0.1"

